[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-discord-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "fastapi>=0.115,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "ruamel.yaml>=0.18"]

# A Hermes plugin, not an importable package: installing only pulls in dependencies.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
